name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:

# Grants the action permission to push the SVG to your repository
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Gold snake, with dots scaling from light crimson down to #6b0927
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#D4AF37&color_dots=#f0c2cd,#cf8a9d,#ad556f,#8a2745,#6b0927
            
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
