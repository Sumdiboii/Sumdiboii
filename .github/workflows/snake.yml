name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:

# FIX 1: Grants the action permission to push the SVG to your repository
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # FIX 2: Bumped checkout to v4 to clear the Node warning
      - uses: actions/checkout@v4 
      
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#D4AF37&color_dots=#ebedf0,#f5e5ad,#e3c878,#d4af37,#947a26
            
      # FIX 2: Bumped ghaction-github-pages to v4 to clear the Node warning
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
